site_name: AMS Digital Scholar
site_url: https://amsds.netlify.app/
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Our Strategy:
      - The DS Vision: index.md
      - The Research Chain: workflow_guide.md
  - Research Pathways:
      - 'Phase 1: Discovery':
          - 'Overview: AI Discovery': tools/ai_discovery.md
          - 'Tutorial: Research Rabbit': tutorials/research_rabbit.md
          - 'Tutorial: AI Discovery Guide': tutorials/ai_discovery_guide.md
      - 'Phase 2: Collection':
          - 'Overview: Zotero (References)': tools/zotero.md
          - 'Overview: Tropy (Images)': tools/tropy.md
          - 'Tutorial: Zotero Setup': tutorials/zotero_setup.md
          - 'Tutorial: Tropy Guide': tutorials/tropy_guide.md
      - 'Phase 3: Annotation':
          - 'Overview: Hypothesis': tools/hypothesis.md
          - 'Tutorial: Hypothesis Guide': tutorials/hypothesis_guide.md
      - 'Phase 4: Synthesis':
          - 'Overview: NotebookLM': tools/notebooklm.md
          - 'Overview: Obsidian': tools/obsidian.md
          - 'Tutorial: Obsidian Vault': tutorials/obsidian_vault.md
  - Strategic Growth:
      - Promotion Strategy: research/promotion_strategy.md
      - Future Proposals: research/future_proposals.md
  - Reference:
      - Tutorials Archive: tutorials/index.md
      - Research Archive: research/index.md
      - Obsidian & SharePoint: research/obsidian_sharepoint_integration.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
