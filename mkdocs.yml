site_name: AMS Digital Scholar
site_url: https://amsds.netlify.app/
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Tools:
      - Zotero: tools/zotero.md
      - Obsidian: tools/obsidian.md
      - Tropy: tools/tropy.md
      - Hypothesis: tools/hypothesis.md
      - AI Discovery: tools/ai_discovery.md
      - NotebookLM: tools/notebooklm.md
  - Tutorials:
      - Index: tutorials/index.md
      - Zotero Setup: tutorials/zotero_setup.md
      - Obsidian Vault: tutorials/obsidian_vault.md
      - Tropy Guide: tutorials/tropy_guide.md
      - Hypothesis Guide: tutorials/hypothesis_guide.md
      - AI Discovery Guide: tutorials/ai_discovery_guide.md
      - Research Rabbit: tutorials/research_rabbit.md
  - Research:
      - Index: research/index.md
      - Promotion Strategy: research/promotion_strategy.md
      - Future Proposals: research/future_proposals.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
